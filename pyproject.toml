[project]
name = "gravity-camera-system"
version = "0.1.0"
description = "Camera-specific person detection experiments for Gravity trampoline park"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "ultralytics>=8.4.204",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
